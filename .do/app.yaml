# Digital Ocean App Platform spec (SPEC TECH-10): one service — the Express
# monolith serving both /api and the built React SPA. MongoDB is a MongoDB
# Atlas cluster, provisioned separately; its connection string binds MONGODB_URI.
#
# Env keys mirror server/.env.example exactly. SECRET values and the bare
# (value-less) keys are filled in the DO dashboard (or `doctl apps`).
name: slide-machine
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: bloombar/slide-machine
      branch: better-faster
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
      # How many proxies sit in front of the app, for `req.ip`. Every rate
      # limit is keyed on that address, so this must match the real chain:
      # too low and all callers share one budget, too high and a caller picks
      # their own address out of X-Forwarded-For.
      #
      # Deliberately 0 until measured. GET /api/health reports
      # `proxy.xffEntries` — how many X-Forwarded-For entries arrived — and
      # this is set to match. Measure from a request that sends no
      # X-Forwarded-For of its own: proxies append, so a network whose egress
      # inserts one reads high, and setting this high is the direction that
      # hurts. Confirm the reading by sending one extra entry and checking the
      # number rises by exactly one. Left at 0 every caller shares one budget
      # — wrong, but wrong in the safe direction; set above the real chain and
      # a caller chooses their own address, which is not safe at all.
      - key: TRUST_PROXY_HOPS
        value: '0'
      - key: MONGODB_URI
        type: SECRET
      # Auth signing secrets — required at boot (min 32 chars each)
      - key: JWT_SECRET
        type: SECRET
      - key: JWT_REFRESH_SECRET
        type: SECRET
      # Public origin, for the Google OAuth redirect URI (https, no trailing /)
      - key: PUBLIC_BASE_URL
      # AI generation (Gemini)
      - key: GEMINI_API_KEY
        type: SECRET
      # Real-time speech-to-text (Google Cloud): switch the provider on, then
      # supply the service-account JSON inline — no key file in the container.
      - key: TRANSCRIPTION_PROVIDER
        value: google-cloud
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        type: SECRET
      - key: GOOGLE_CLOUD_TRANSLATION_KEY
        type: SECRET
      # Google sign-in (AUTH-1)
      - key: GOOGLE_OAUTH_CLIENT_ID
        type: SECRET
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        type: SECRET
      # The same client id, inlined into the SPA at BUILD time so the "Continue
      # with Google" button renders (Vite reads VITE_* at build; .env files are
      # not in the image). Public — it ships in the bundle — so not a SECRET.
      - key: VITE_GOOGLE_OAUTH_CLIENT_ID
        scope: BUILD_TIME
        value: 86666154289-0sk4nhq0l7di9arfuecllhgpei0gga5b.apps.googleusercontent.com
      # Image enrichment (IMG-1)
      - key: FLICKR_API_KEY
        type: SECRET
      # Uploads/exports on DO Spaces via the S3 adapter (TECH-10)
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
      - key: S3_REGION
      - key: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
        type: SECRET
      - key: S3_SECRET_ACCESS_KEY
        type: SECRET
      - key: S3_PUBLIC_BASE_URL
      # --- Uncomment and set as features land (mirrors server/.env.example) ---
      # - key: GITHUB_OAUTH_CLIENT_ID
      #   type: SECRET
      # - key: GITHUB_OAUTH_CLIENT_SECRET
      #   type: SECRET
      # - key: CONNECTED_ACCOUNT_TOKEN_ENC_KEY
      #   type: SECRET
      # - key: STRIPE_SECRET_KEY
      #   type: SECRET
      # - key: STRIPE_WEBHOOK_SECRET
      #   type: SECRET
      # - key: SMTP_HOST
      # - key: SMTP_PORT
      # - key: SMTP_USER
      #   type: SECRET
      # - key: SMTP_PASSWORD
      #   type: SECRET
      # The "Send feedback" page is hidden unless mail can be delivered:
      # the SMTP_* set above, plus these. MAIL_FROM defaults to SMTP_USER.
      # - key: MAIL_PROVIDER      # smtp | log | none (default smtp)
      # - key: MAIL_FROM
      # - key: MAIL_FROM_NAME   # inbox display name, e.g. "The Slide Machine"
      # - key: FEEDBACK_EMAIL
      # Named verbatim by /privacy and /terms; blank shows a bracketed
      # placeholder there. Not secret. See docs/DEPLOY.md "Before launch".
      # - key: OPERATOR_NAME
      # - key: OPERATOR_JURISDICTION
      # - key: OPERATOR_CONTACT_EMAIL
      # - key: OPERATOR_POSTAL_ADDRESS
