# Digital Ocean App Platform spec (SPEC TECH-10): one service — the Express
# monolith serving both /api and the built React SPA. MongoDB is DO Managed
# MongoDB, provisioned separately; its connection string binds MONGODB_URI.
#
# Set the real repo and secret values in the DO dashboard (or `doctl apps`).
name: slide-machine
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: bloombar/slide-machine
      branch: master
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: JWT_REFRESH_SECRET
        type: SECRET
      # --- Uncomment and set as features land (mirrors server/.env.example) ---
      # - key: GEMINI_API_KEY
      #   type: SECRET
      # Real-time Cloud STT: mount the service-account JSON and point this at
      # it (only when TRANSCRIPTION_PROVIDER=google-cloud).
      # - key: GOOGLE_APPLICATION_CREDENTIALS
      # - key: GOOGLE_CLOUD_TRANSLATION_KEY
      #   type: SECRET
      # - key: GOOGLE_OAUTH_CLIENT_ID
      #   type: SECRET
      # - key: GOOGLE_OAUTH_CLIENT_SECRET
      #   type: SECRET
      # - key: GITHUB_OAUTH_CLIENT_ID
      #   type: SECRET
      # - key: GITHUB_OAUTH_CLIENT_SECRET
      #   type: SECRET
      # - key: CONNECTED_ACCOUNT_TOKEN_ENC_KEY
      #   type: SECRET
      # - key: STRIPE_SECRET_KEY
      #   type: SECRET
      # - key: STRIPE_WEBHOOK_SECRET
      #   type: SECRET
      # - key: FLICKR_API_KEY
      #   type: SECRET
      # - key: S3_ENDPOINT          # e.g. https://nyc3.digitaloceanspaces.com
