# Digital Ocean App Platform spec (SPEC TECH-10): one service — the Express
# monolith serving both /api and the built React SPA. MongoDB is DO Managed
# MongoDB, provisioned separately; its connection string binds MONGODB_URI.
#
# Set the real repo and secret values in the DO dashboard (or `doctl apps`).
name: slide-machine
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: bloombar/slide-machine
      branch: master
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        type: SECRET
