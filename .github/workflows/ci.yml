# CI pipeline (SPEC TECH-11): lint → format → typecheck → unit →
# integration (real Mongo service container) → build → e2e.
# The 100% coverage gate is deliberately deferred to Phase 3 (ROADMAP §4).
name: CI

# Feature-branch pushes are covered by `pull_request`; listing them under
# `push` as well ran the whole pipeline twice for every push to an open PR.
# A branch with no PR open is therefore unchecked until the PR is opened —
# the intended trade for the branch → PR flow (docs/CONTRIBUTING.md).
on:
  push:
    branches: [better-faster, master]
  pull_request:

# Supersede earlier runs when a PR is pushed to again, but never on the
# integration branches — every commit landing there deserves its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/slide-machine-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      # The download can stall indefinitely (it once burned hours of CI),
      # so bound each try and retry twice before giving up.
      - name: Install Playwright browsers
        timeout-minutes: 15
        run: |
          # The runner image runs unattended-upgrades of its own after boot and
          # holds the dpkg lock while it does. `playwright install --with-deps`
          # shells out to apt-get, which fails outright rather than waiting for
          # a lock, so the install died with "Could not get lock
          # /var/lib/dpkg/lock-frontend". The retries did not help: with no
          # backoff, all three spent themselves inside a minute against a lock
          # still being held.
          wait_for_apt() {
            command -v fuser >/dev/null 2>&1 || return 0
            for _ in $(seq 1 60); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || return 0
              echo "Another apt-get holds the dpkg lock; waiting..."
              sleep 5
            done
            echo "::warning::dpkg lock still held after 5 minutes; trying anyway"
          }
          for i in 1 2 3; do
            wait_for_apt
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright install attempt $i timed out or failed; retrying"
            # Backoff, so a retry is a fresh chance rather than the same
            # failure three times.
            sleep $((i * 30))
          done
          exit 1

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
