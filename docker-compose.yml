# One-command local stack (SPEC TECH-11): the app plus MongoDB, and an
# optional MinIO for S3-compatible object storage (start with
# `docker compose --profile storage up`). Everything here is optional —
# the server runs against any MONGODB_URI / S3_ENDPOINT you host yourself.
services:
  app:
    build: .
    ports:
      - '3000:3000'
    # Single source of truth: load the full server config from the
    # gitignored server/.env. The environment: block below overrides only
    # the few values that must point at in-network compose services rather
    # than the host — environment: takes precedence over env_file.
    env_file:
      - server/.env
    environment:
      # server/.env points at a host mongod (with auth); reach the compose
      # mongo service by name instead (it runs without auth).
      MONGODB_URI: mongodb://mongo:27017/slide-machine
      # In-network MinIO (storage profile); server/.env points at the host.
      # Using a MinIO on the host instead? Point S3_ENDPOINT at
      # http://host.docker.internal:9000
      S3_ENDPOINT: http://minio:9000
      # Express serves the built SPA itself here on 3000, so the
      # browser-facing origin is 3000 (server/.env uses the 5173 Vite dev
      # server, which does not exist in this stack).
      PUBLIC_BASE_URL: http://localhost:3000
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    ports:
      # Host port 27018 so a locally-installed mongod on 27017 can coexist;
      # reach this container from the host at mongodb://localhost:27018
      - '27018:27017'
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio
    # Opt-in so `docker compose up` cannot clash with a MinIO already
    # running on the host (ports 9000/9001)
    profiles: [storage]
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: creates the dev bucket and allows anonymous reads, so
  # S3_PUBLIC_BASE_URL works out of the box; exits when done
  minio-init:
    image: minio/mc
    profiles: [storage]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/slide-machine-dev &&
      mc anonymous set download local/slide-machine-dev
      "

volumes:
  mongo-data:
  minio-data:
