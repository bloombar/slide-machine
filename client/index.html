<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Slide Machine</title>
    <meta name="description" content="Speak freely — the slides will follow." />
    <meta name="theme-color" content="#ffffff" />

    <!-- Icons. The .ico is the fallback for browsers that cannot read the
      SVG one; declaring it as 32x32 (rather than "any") is what makes those
      that can prefer the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Slide Machine" />

    <!-- Link previews. The server rewrites these paths to absolute URLs on
      the way out, because scrapers will not resolve a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Slide Machine" />
    <meta property="og:title" content="The Slide Machine" />
    <meta
      property="og:description"
      content="Speak freely — the slides will follow."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Slide Machine — a slide inside a speech bubble"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
