- id: QUIZ-6
  title: Loose coupling
  full: "The two repositories stay decoupled: neither depends on the other's
    internals, and the contract is the library's exported function signatures,
    versioned by semver and a pinned git ref (not an HTTP API). The Quiz
    Generator stays independently usable as its own CLI and keeps its publishing
    logic auth-agnostic — the caller injects the authorized client — so it
    remains reusable outside Slide Machine. Known limitation — domain
    restriction. Restricting Form responses to the NYU Workspace organization is
    not exposed by the Google Forms REST API (only quiz settings and
    email-collection are); it is an admin/UI-level control. So authMode:
    'domain-restricted' in the publish config is not enforceable…"
