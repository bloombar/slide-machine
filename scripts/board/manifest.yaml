- id: GEN-4
  title: Post-lecture AI reformat (holistic regeneration)
  full: 'Once a session ends (CAP-1 Stop) and the full transcript is available,
    the user is offered a "Reformat with AI" option that regenerates the deck
    holistically from the complete transcript plus project seed context —
    something the live, phrase-by-phrase pipeline (GEN-1) cannot do because it
    lacks the full picture. Delivered as a "Refine" action with three
    independently-toggleable passes (identify speakers / refine slide content /
    refine spoken narration), run together as one background job the client
    polls; it can also be run per slide on demand. (Design: DECISIONS.md
    "Refine: three opt-in passes".) Identifies speakers (diarization) —
    post-hoc, the retained lecture audio (P-6) is grouped into…'
