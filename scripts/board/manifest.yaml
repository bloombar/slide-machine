- id: ADMIN-7
  title: Audit log
  full: "An append-only, immutable log of admin actions that change or expose user
    data: private lecture/project views (ADMIN-3), password resets, bans/unbans,
    deletes (ADMIN-4), settings edits (ADMIN-5), and views of soft-deleted
    content (ADMIN-6). Each entry records the acting admin (id + email
    snapshot), a namespaced action name (e.g. user.delete, deck.delete,
    project.private_view), an optional target (type + id), optional
    action-specific details, and a timestamp. Entries are written through one
    server module into a dedicated collection and no API can edit or delete
    them; every admin mutation endpoint must record itself. The Logs page
    (ADMIN-2) lists them newest-first, paginated, with CSV export…"
  section: §20 Administration, Operations & Moderation
  family: ADMIN
  phase: 2
  status: Done
  review: false
  note: administration & moderation
- id: ADMIN-8
  title: Settings change log
  full: "A second, separate append-only log, beside the admin audit log (ADMIN-7):
    where that one records what admins did, this one records every settings
    change on the platform, whoever made it — a user changing their own account
    settings, a collaborator with edit access changing a project's or lecture's,
    or an admin editing on someone's behalf (ADMIN-5). An admin's settings edit
    appears in both. Each entry records the acting user (id + email snapshot),
    the role they acted in (owner, editor, admin), the entity whose settings
    changed (kind, id, and its name snapshotted at the time), the owner those
    settings belong to, the changed fields as {field: {from, to}}, and a
    timestamp. An edit that changes…"
  section: §20 Administration, Operations & Moderation
  family: ADMIN
  phase: 2
  status: Backlog
  review: true
  note: administration & moderation
