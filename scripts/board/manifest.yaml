- id: BILL-1
  title: Subscription tiers
  full: "The product offers four subscription tiers, each priced accordingly
    (exact prices set in configuration — BILL-6): Free — basic level for
    personal/occasional use; the default tier on registration. Sized to a couple
    of weeks of one course. Fresh — entry paid tier, the step off Free; sized to
    one course. Pro — mid level for professional / regular instructional use;
    sized to three courses, with higher caps and access to paid-tier features.
    Max — highest tier; the largest usage caps and full feature access. Every
    cap is finite — there is no unlimited tier, because unbounded usage is
    unbounded cost. Users who outgrow Max are invited to contact us rather than
    shown an upgrade path that does not…"
  section: §5 Plans, Billing & Usage Limits
  family: BILL
  phase: 3
  status: Backlog
