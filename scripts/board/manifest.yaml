- id: IMG-3
  title: Image disambiguation
  full: "Polysemous terms must not pull the wrong picture — speech about
    \"Prince\" the musician must not surface Wikipedia's imagery for the royal
    title. The system disambiguates both before and after fetching:
    Disambiguated queries — the AI's recommended keywords (GEN-7) carry
    qualifying context from the lecture so the query targets the intended sense
    (e.g., Prince (musician) / Prince Rogers Nelson, not bare Prince). The model
    has the full phrase, rolling context, and seed context needed to resolve it.
    Entity resolution — for the Wikimedia path, the disambiguated term is
    resolved to a specific Wikidata/Wikipedia entity (choosing among candidates
    by best contextual match) and that entity's image is…"
