- id: PROJ-2
  title: Project lifecycle
  full: Projects persist in MongoDB and can be reopened, duplicated, archived, and
    deleted. Deletion is a soft delete — recoverable during a retention window
    before a background sweep permanently purges it, and cascading to the
    project's decks (P-10/P-11). A project may contain multiple decks (e.g., one
    per lecture session).
  section: §6 Slide Projects & Seeding
  family: PROJ
  phase: 1
  status: Done
  review: false
