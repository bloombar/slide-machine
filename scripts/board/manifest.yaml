- id: ADMIN-1
  title: Admin identity & authorization
  full: "Admin status is an email allowlist (ADMIN_EMAILS — TECH-4), not a role or
    field on the account; there is deliberately no in-app way to grant it. The
    list is read on every request, so access changes take effect without a code
    deploy. Every /api/admin route is gated by requireAuth + requireAdmin; the
    client menu and route guard are cosmetic — the allowlist is the real
    security boundary. Admin reads bypass per-object ACLs (P-4): an allowlisted
    account can read any user's projects, lectures, and seed material — so the
    list is kept minimal (P-12; FERPA — P-1/P-2). Admins moderate but are not
    moderated: any moderation, settings, or deletion action (ADMIN-4/ADMIN-5)
    targeting an allowlisted email…"
  section: §20 Administration, Operations & Moderation
  family: ADMIN
  phase: 2
  status: Done
  review: false
  note: administration & moderation
- id: ADMIN-2
  title: Admin console
  full: 'A read-mostly console (/app/admin) answers "who is using this and what
    have they made," and carries the moderation surface. Secondary navigation —
    every admin page shows a horizontal secondary nav bar, just below the
    standard header, linking the top-level sections: Overview, Users, Projects,
    Lectures, and Logs. Overview — deployment-wide averages and totals, chiefly
    cost: per user, per lecture, per project, and per student, alongside active
    users, active students, and the largest spenders (BILL-7). Site-wide
    directories, each paginated and sortable: Users (email, handle, join date),
    Projects (title, owner, visibility, lecture count, timestamps), and Lectures
    (title, project, owner…'
  section: §20 Administration, Operations & Moderation
  family: ADMIN
  phase: 2
  status: Done
  review: false
  note: administration & moderation
- id: ADMIN-3
  title: Viewing user content & seed material
  full: An admin can open any lecture in the deck viewer (/d/:slug) and any
    project in the product view, regardless of visibility, on the allowlist's
    authority. The content there is read-only — slides, recordings, and
    generation runs stay with the owner; only its settings are editable
    (ADMIN-5). Admin project and lecture detail pages surface the seed material
    (SEED-1/SEED-2) — documents, seed text, and image captions — so an operator
    can see what fed generation. Privacy-infringing views are confirmed and
    audited — opening a private lecture or a private project requires explicit
    confirmation and writes an audit-log entry (ADMIN-7); routine viewing of
    already-public content is not logged.
  section: §20 Administration, Operations & Moderation
  family: ADMIN
  phase: 2
  status: Backlog
  review: false
  note: administration & moderation
- id: ADMIN-4
  title: Moderation actions
  full: "Every action here asks for confirmation and writes an audit-log entry
    (ADMIN-7): Delete a project / lecture / user — a soft delete (P-10): the
    record is tombstoned and cascades to its children (a deleted project takes
    its lectures, slides, seed material, transcripts, and retained audio),
    recoverable during the retention window and purged by the same sweep (P-11)
    as user-initiated deletion — not an immediate hard delete. Ban / unban an
    email — a banned email can no longer sign in (password or OAuth) or
    register, and its sessions end immediately; content persists until deleted
    separately. Unban lifts it (also confirmed + audited). Reset a user's
    password — sets a new password and signs the…"
  section: §20 Administration, Operations & Moderation
  family: ADMIN
  phase: 2
  status: Done
  review: false
  note: administration & moderation
- id: ADMIN-5
  title: Editing any entity's settings
  full: "An admin can modify the settings of any user, project, or lecture — e.g.
    a lecture's/project's visibility or generation settings, or a user's
    profile/account fields — even when not the owner. Settings are edited in the
    product itself, in the same settings UI the entity's owner uses (ADMIN-2
    links there from each detail page): an account's from the Settings button on
    the user's profile page, a project's or a lecture's from its settings modal.
    The console carries no separate settings form for any of them, and its
    detail lists are read-only. Every such edit requires explicit confirmation
    and is audited (ADMIN-7), recording what changed. Editing an entity that is
    not the admin's own is…"
  section: §20 Administration, Operations & Moderation
  family: ADMIN
  phase: 2
  status: Done
  review: false
  note: administration & moderation
- id: ADMIN-6
  title: Viewing soft-deleted content
  full: Soft-deleted records are hidden from all normal reads (P-10), but an admin
    can view soft-deleted entities (users, projects, lectures, and other owned
    records) in the console — for recovery or audit — until the retention sweep
    purges them (P-11). Every access to soft-deleted content is audited
    (ADMIN-7).
  section: §20 Administration, Operations & Moderation
  family: ADMIN
  phase: 2
  status: Backlog
  review: false
