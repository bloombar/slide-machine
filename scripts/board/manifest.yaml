- id: P-1
  title: All student data (rosters, quiz responses, scores) stays within…
  full: All student data (rosters, quiz responses, scores) stays within
    NYU-approved, FERPA-compliant systems (NYU Google Workspace, NYU-provided
    models).
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-2
  title: No student PII is sent to external AI models.
  full: No student PII is sent to external AI models. Only de-identified
    lecture/slide/seed text drives slide and quiz generation.
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-3
  title: All secrets live in server-side .env (Gemini/OpenAI, Google Cloud…
  full: All secrets live in server-side .env (Gemini/OpenAI, Google Cloud, OAuth,
    JWT, SMTP, Stripe) — never committed and never exposed to the client. (V1's
    committed openai.key and localStorage key storage are removed in V2.)
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-4
  title: Passwords hashed; JWTs signed with rotating secrets; reset/verification…
  full: Passwords hashed; JWTs signed with rotating secrets; reset/verification
    links time-limited and single-use; ownership/role checks on every mutating
    route.
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-5
  title: Google Drive/Docs/Slides access uses per-user OAuth consent and…
  full: Google Drive/Docs/Slides access uses per-user OAuth consent and
    least-privilege scopes; imported content is the user's own.
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-6
  title: Microphone audio drives transcription; capture is bounded by explicit…
  full: 'Microphone audio drives transcription; capture is bounded by explicit
    start/stop with clear UI state. Audio is not retained by default. When
    retention is explicitly enabled (for diarization — GEN-4 — and per-slide
    original-audio playback — PLAY-2), it applies only to the server-proxied
    engine, is gated on deck edit access, is server-only (never exposed in a DTO
    or shared surface), and is auto-deleted after a bounded window (and as soon
    as diarization consumes it). Retained student voices remain subject to
    P-1/P-2. (Design: DECISIONS.md "Audio retention".)'
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-7
  title: Evaluation data is anonymized before analysis and submitted for…
  full: Evaluation data is anonymized before analysis and submitted for
    IRB/program review; findings (positive or negative) shared with the NYU
    community.
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-8
  title: Payments are processed by the configured billing provider (Stripe by…
  full: Payments are processed by the configured billing provider (Stripe by
    default); the app stores no raw card data. Provider webhooks are
    signature-verified; only minimal, provider-neutral billing references
    (billingCustomerId, subscription status) are stored.
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-9
  title: Connected-account (Google Drive / GitHub — EXP-4) OAuth tokens are…
  full: Connected-account (Google Drive / GitHub — EXP-4) OAuth tokens are stored
    encrypted at rest, request only least-privilege scopes, are per-user and
    revocable, and are never exposed to the client. Exports that contain student
    data must not be pushed to public GitHub/Drive locations (FERPA — P-1/P-2).
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
- id: P-11
  title: Soft-deleted records (P-10) are permanently purged by a scheduled daily…
  full: Soft-deleted records (P-10) are permanently purged by a scheduled daily
    background sweep once their deletedAt is older than a configurable window
    (DELETED_DATA_RETENTION_DAYS, default 90 days — TECH-4). Purge is a hard
    cascade delete that also removes owned children and stored blobs (seed
    assets, exports, and any retained audio — P-6), so no orphaned data
    survives. 0 disables the sweep (tombstones kept indefinitely). This bounds
    storage cost and honors data-minimization, consistent with the
    audio-retention sweep (P-6).
  section: §16 Privacy, Security & Compliance
  family: P
  phase: 3
  status: Backlog
  review: false
