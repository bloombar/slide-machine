- id: AUTH-1
  title: Registration & sign-in methods
  full: "Users can register and log in by either of two supported methods: Email +
    password (with display name). Passwords are stored hashed (e.g.,
    bcrypt/argon2); registration requires confirming an email verification link
    (AUTH-3) before the account is fully enabled. Google sign-in (OAuth 2.0 /
    OpenID Connect), which supports NYU Google accounts (NYU Workspace) as well
    as standard Google accounts. Google-verified email needs no separate
    verification step. GitHub sign-in (OAuth), for users who prefer their GitHub
    identity (convenient for the pilot's student developers). A given verified
    email maps to a single account: if a user who registered with a password
    later signs in with Google or GitHub for…"
  section: §4 Accounts & Authentication
  family: AUTH
  phase: 1
  status: Done
  review: true
  note: split id — GitHub part tracked separately
- id: AUTH-2
  title: Login & sessions
  full: Email/password login issues JWT access + refresh tokens. Sessions persist
    across reloads; logout invalidates the refresh token.
  section: §4 Accounts & Authentication
  family: AUTH
  phase: 1
  status: Done
  review: false
- id: CAP-1
  title: Session lifecycle
  full: The user explicitly controls a live session with Start, Pause/Resume, and
    Stop. Stop finalizes the deck and can trigger quiz generation (§17). Session
    state (listening / paused / stopped) is clearly indicated.
  section: §8 Live Lecture Capture
  family: CAP
  phase: 1
  status: Done
  review: false
- id: CAP-2
  title: Microphone & permissions
  full: The app requires microphone access, prompts for and reports permission
    state, and surfaces actionable errors rather than failing silently.
  section: §8 Live Lecture Capture
  family: CAP
  phase: 1
  status: Done
  review: false
- id: CAP-3
  title: Speech-to-text transcription
  full: "Uses Google Cloud Speech-to-Text for fast, accurate, low-latency
    transcription (removing V1's Chrome-only constraint). Audio is streamed and
    segmented into phrases on natural pauses; interim text may display as live
    captions, finalized phrases drive generation. Speech adaptation — when a
    preflight concept set exists (PREP-3), its terms, names, acronyms, and
    synonyms are supplied to Google Cloud STT as phrase hints/boosts so domain
    jargon and proper nouns transcribe correctly. Target: near-real-time latency
    suitable for live lecture (a key evaluation metric — §12). Raw audio is not
    retained by default; optional bounded retention (for diarization and
    original-audio playback) is governed by…"
  section: §8 Live Lecture Capture
  family: CAP
  phase: 1
  status: Done
  review: false
- id: EDIT-1
  title: Full content editing
  full: "Users can add, edit, and delete all slide content: slide text
    (title/body/bullets/caption), images (replace from seed, re-fetch, upload,
    or remove), and slide order."
  section: §10 Playback, Editing & Sharing
  family: EDIT
  phase: 1
  status: Done
  review: false
- id: GEN-1
  title: Speech-to-slide generation
  full: Each finalized phrase, combined with project seed context, is sent to the
    Gemini API, which identifies the topic, produces concise slide text, and
    maintains short rolling context across recent phrases so slides cohere
    across a topic. The model also selects the slide layout for each content
    block from the active template's options (GEN-6), returning content already
    mapped to the chosen layout's slots, and decides whether each phrase starts
    a new slide or updates the current one (GEN-8).
  section: §9 Slide Generation & Enrichment
  family: GEN
  phase: 1
  status: Done
  review: false
- id: GEN-2
  title: AI-provider abstraction
  full: "The core logic of the slide generator (and quiz maker) is decoupled from
    any specific LLM or AI engine. All AI calls — speech-to-text, slide-content
    generation, and quiz generation — go through a provider-agnostic interface
    so engines can be swapped in/out without touching the generation logic.
    Gemini is the default provider for the pilot (migrating from V1's OpenAI
    integration), but the system must support substituting other commercial
    providers or a locally-hosted/in-house model purely via configuration and an
    adapter — no changes to the core generator. The abstraction spans every
    costly AI capability: transcription (CAP-3), text generation (GEN-1), and
    quiz generation (QUIZ-1) each…"
  section: §9 Slide Generation & Enrichment
  family: GEN
  phase: 1
  status: Done
  review: false
- id: GEN-3
  title: Live display
  full: Generated slides render full-screen in real time as the user speaks,
    advancing as new slides are produced, with a configurable minimum dwell time
    per slide.
  section: §9 Slide Generation & Enrichment
  family: GEN
  phase: 1
  status: Done
  review: false
- id: GEN-5
  title: Progressive slide rendering (skeleton loaders)
  full: "Live generation has unavoidable lag: slide text trails the spoken phrase
    (CAP-3), and an enriched image (IMG-1) may arrive later still. Slides
    therefore render progressively, so the audience always sees forward motion
    without being confused by constantly changing content. Render-as-ready — a
    slide shows whatever parts are ready (e.g., title and body) immediately;
    each part still pending shows a skeleton placeholder sized to the final
    layout, so its space is reserved up front. Slot-in on arrival — slower
    content (typically the image, occasionally a refined heading) fades into its
    reserved slot when it arrives, without reflowing or reordering content
    already on screen — no layout shift.…"
  section: §9 Slide Generation & Enrichment
  family: GEN
  phase: 1
  status: Done
  review: false
- id: GEN-6
  title: AI layout selection
  full: The AI does not only write slide text — it also chooses which layout each
    content block uses. The active template's layout descriptors (TMPL-6) are
    serialized into the generation request as the explicit option set the model
    must select from. For each content block the model returns a chosen
    layoutType plus the content mapped to that layout's slots
    (title/body/bullets/image/caption/columns), so a list-like block becomes a
    list layout, a single striking idea becomes a quote/callout, etc. The choice
    is constrained to the template's available layouts; if the model returns an
    unknown or ill-fitting type, the system falls back to a sensible default
    layout (e.g., content). The user can always…
  section: §9 Slide Generation & Enrichment
  family: GEN
  phase: 1
  status: Done
  review: false
- id: IMG-1
  title: Real-time image enrichment
  full: "Slides are enriched with images using the AI's per-slide image guidance
    (GEN-7), in priority order: 1. A seeded image the AI selected for the slide,
    or whose caption/keywords match the slide topic (SEED-2). 2. An image
    fetched in real time from Wikimedia, Flickr, and Openverse APIs using the
    AI's recommended keywords (falling back to the slide topic if none). 3. A
    graceful fallback (placeholder/solid layout) when no image is recommended or
    found."
  section: §9 Slide Generation & Enrichment
  family: IMG
  phase: 1
  status: Done
  review: false
- id: IMG-2
  title: Fault tolerance
  full: "Image enrichment is fault-tolerant: any single image API may be slow,
    rate-limited, or down without causing a hard failure. The system times out
    per source, falls back across sources, and never blocks slide display on
    image retrieval. Licensing/attribution metadata is captured where the source
    requires it."
  section: §9 Slide Generation & Enrichment
  family: IMG
  phase: 1
  status: Done
  review: false
