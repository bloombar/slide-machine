- id: TECH-2
  title: Back-end
  full: "Express.js (Node) REST API. JWT-based authentication: short-lived access
    tokens + refresh, sent as Authorization: Bearer (or secure httpOnly cookie).
    Protected routes enforce role/ownership checks. Stateless API layer; all
    persistence in MongoDB. Billing state is reconciled from Stripe webhooks."
  section: §14 Technical Stack & Conventions
  family: TECH
  phase: 1
  status: Done
  review: false
- id: TECH-3
  title: Database
  full: MongoDB (via an ODM such as Mongoose). Collections defined in §15. Stores
    users, subscriptions, usage records, projects, decks, slides, templates,
    votes, and social/feed metadata. Raw lecture audio is not persisted.
  section: §14 Technical Stack & Conventions
  family: TECH
  phase: 1
  status: Done
  review: false
- id: TECH-5
  title: Client configuration
  full: Client build/runtime variables live in a Vite env file (.env.local,
    VITE_-prefixed), e.g. VITE_API_BASE_URL, VITE_STRIPE_PUBLISHABLE_KEY, public
    Google/GitHub OAuth client IDs (for sign-in and connect flows), feature
    flags, and analytics toggles. No secrets are exposed to the client.
  section: §14 Technical Stack & Conventions
  family: TECH
  phase: 1
  status: Done
  review: false
- id: TECH-6
  title: Shared types & data models
  full: Where feasible, front-end and back-end share TypeScript types and
    data-model definitions (e.g., a shared packages/types or shared/ module) so
    DTOs, deck/slide/template/plan schemas, and API contracts have a single
    source of truth. The codebase is TypeScript end-to-end.
  section: §14 Technical Stack & Conventions
  family: TECH
  phase: 1
  status: Done
  review: false
- id: TECH-7
  title: Testing & coverage
  full: 100% code coverage target across unit, integration, and end-to-end tests.
    Unit/integration via a standard runner (e.g., Vitest/Jest) for both client
    and server; integration tests exercise the Express API against a test
    MongoDB instance. End-to-end tests use a Playwright harness covering the
    critical user journeys (register → subscribe → create project → seed → live
    capture → edit → share → export → vote), including cap-enforcement and
    upgrade paths. External services (Gemini, Google Cloud, image APIs, Stripe,
    Google Forms/Drive) are mocked/stubbed in CI; coverage gates block merges
    below target.
  section: §14 Technical Stack & Conventions
  family: TECH
  phase: 1
  status: Done
  review: false
- id: TECH-8
  title: AI-provider abstraction layer
  full: "The system implements GEN-2 with a capability-based adapter layer so the
    core slide-generation and quiz-generation logic depends only on interfaces,
    never on a concrete AI vendor (dependency inversion): Capability interfaces
    (defined once in the shared types module, TECH-6): TranscriptionProvider
    (audio → text), GenerationProvider (speech + seed context + layout
    descriptors + seeded-image descriptors → slide content with a chosen layout
    and image guidance — GEN-6/GEN-7), QuizGenerationProvider (slide text → quiz
    definition), and ImageGenerationProvider (prompt → generated image — IMG-4).
    Each interface fixes the request/response contract independent of any
    vendor. Adapters implement those…"
  section: §14 Technical Stack & Conventions
  family: TECH
  phase: 1
  status: Done
  review: false
- id: TECH-10
  title: Deployment topology (Digital Ocean App Platform)
  full: "The modular monolith (§13) deploys to Digital Ocean App Platform (PaaS),
    chosen for minimal operational overhead (step-by-step setup: DEPLOY.md): App
    components — one API service (the Express monolith) plus a static site
    component for the built React/Vite SPA (or the API serves the static
    bundle). App Platform provides managed TLS, build-on-push, and rolling
    deploys. Secrets are set as App Platform env vars, mirroring TECH-4.
    Database — MongoDB Atlas (automated backups, point-in-time restore) rather
    than self-hosted. Object storage — DO Spaces (S3-compatible) for uploaded
    seed assets, cached enrichment images, and generated exports. Scaling — the
    API is stateless (JWT), so App Platform can…"
  section: §14 Technical Stack & Conventions
  family: TECH
  phase: 1
  status: Done
  review: false
- id: TECH-11
  title: Local dev & CI/CD
  full: Local dev — a Dockerfile plus docker compose (app + MongoDB, with Spaces
    mockable via an S3-compatible local service) lets contributors — including
    pilot students — run the whole stack with one command, and lets the
    Playwright e2e harness (TECH-7) run against a realistic environment. CI/CD —
    GitHub Actions runs unit + integration + e2e tests and enforces the 100%
    coverage gate, then auto-deploys to App Platform on push to the default
    branch (App Platform's GitHub integration), replacing V1's GitHub Pages
    workflow (.github/workflows/static.yml). Failed gates block deploy.
  section: §14 Technical Stack & Conventions
  family: TECH
  phase: 1
  status: Done
  review: false
- id: TECH-13
  title: Application action/command layer
  full: "All operations that modify a project, concept set, or deck are exposed
    through a single channel-agnostic action/command layer — a named set of
    operations (e.g., concept.add, concept.disambiguate, slide.editContent,
    slide.setLayout, deck.switchTemplate, deck.reformat, slide.setImageGuidance)
    rather than logic embedded in individual UI handlers. Each action validates
    input, enforces authorization/ownership and plan-cap metering (BILL-3), and
    records the change once — so every channel behaves identically and securely.
    The layer is consumed by multiple front ends: the React UI, the verbal
    preflight loop (PREP-4), the post-lecture reformat (GEN-4), and any future
    agent interface. This makes a…"
  section: §14 Technical Stack & Conventions
