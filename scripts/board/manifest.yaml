- id: TECH-9
  title: Billing-provider abstraction layer
  full: "Billing is decoupled from any specific payment vendor, the same way AI is
    (TECH-8), so the provider can change without touching application logic: A
    single BillingProvider interface abstracts the operations the app needs —
    create/checkout subscription, change tier, open billing portal, cancel, and
    normalize provider webhooks into internal billing events
