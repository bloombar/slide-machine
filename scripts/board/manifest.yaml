- id: FUTURE-a-remote-oauth-authenticated-multi-user-
  title: A remote, OAuth-authenticated, multi-user MCP server that exposes the…
  full: A remote, OAuth-authenticated, multi-user MCP server that exposes the
    action/command layer (TECH-13) as agent tools, letting users modify upcoming
    or saved decks through back-and-forth with an external AI agent (preflight
    and post-lecture). Built as a thin facade over existing actions — reusing
    the same auth, ownership, and plan-cap metering — so it adds reach without
    duplicating logic. Deferred from the pilot for scope/timeline; a good
    student-contribution target.
  section: §18 Future Work
