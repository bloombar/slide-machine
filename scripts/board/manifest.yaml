- id: IMG-4
  title: AI-generated imagery (optional)
  full: For slides that warrant a custom diagram or infographic rather than a
    stock photo, an image can be AI-generated instead of fetched. This is an
    optional, off-by-default enrichment source the AI may choose per slide
    (GEN-7). Provider-agnostic — generation goes through an
    ImageGenerationProvider adapter (TECH-8); most major engines support this
    (e.g., Google's Gemini/Imagen "Nano Banana" family, OpenAI's image models),
    so the engine is configurable/swappable like every other AI capability
    (GEN-2). Best in the latency-tolerant paths — generation is slower and
    costlier than a stock fetch, so it is favored in the post-lecture reformat
    (GEN-4) and on demand; live use is optional and limited.…
