- id: QUIZ-4
  title: Delegated Google access
  full: "Because the Form is created in the instructor's Drive, publishing uses
    the instructor's connected Google account (EXP-4): the monolith builds an
    authorized, least-privilege Forms/Drive client from the instructor's stored
    (encrypted, per-user — P-9) refresh token and injects it into the library.
    Running in-process means the token never leaves the monolith — there is no
    second service to delegate to, which resolves the earlier cross-service
    token question (§19). Prerequisite: this depends on EXP-4's
    connected-account flow (offline Google OAuth with Forms/Drive scopes and an
    encrypted token store), a hard predecessor to publishing that is not yet
    built."
