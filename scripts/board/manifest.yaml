- id: GEN-8
  title: New slide vs. update current
  full: "Not every phrase deserves a brand-new slide. As each finalized phrase
    arrives, the AI decides whether it continues the current slide or starts a
    new one, rather than always emitting a fresh slide. The model classifies the
    phrase against the currently displayed slide and rolling context and returns
    a structured action: update current (append a bullet, extend/refine the
    body, tighten the title), new slide (a topic shift), or no visible change
    (filler/aside). Update operations are additive and contained to preserve
    live stability (GEN-5): a new bullet slots into the reserved layout area,
    but already-committed text is not rewritten on screen; a change too
    disruptive to apply in place is…"
