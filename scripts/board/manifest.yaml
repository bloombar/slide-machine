- id: P-10
  title: Deletion — user-initiated or admin-initiated (§20 ADMIN-4) — of any…
  full: "Deletion — user-initiated or admin-initiated (§20 ADMIN-4) — of any
    entity (user accounts, projects, decks, slides, templates, seed assets,
    concepts, and other owned records — §15) is a soft delete: the record is
    marked with a deletedAt tombstone rather than removed, is excluded from all
    reads, queries, and shared surfaces (but stays visible to admins for
    recovery/audit — ADMIN-6), and can be restored during the retention window.
    Deleting a parent tombstones its children (a deleted project takes its decks
    with it — PROJ-2), guarding against accidental, unrecoverable loss. Deletion
    still enforces ownership/role checks (P-4)."
