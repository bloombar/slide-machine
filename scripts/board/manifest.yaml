    StripeBillingProvider adapter implements it for the pilot; future adapters
    (e.g., Paddle, Braintree, Chargebee) implement the same interface. Only the
    adapter knows vendor-specific objects, API shapes, and webhook formats.
    Application and UI logic deal exclusively in…"
