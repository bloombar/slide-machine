- id: EDIT-4
  title: Whiteboard annotation
  full: Users can draw on slides like a whiteboard — pen (opaque), highlighter
    (semi-transparent), and eraser — from a floating, draggable tool palette.
    Freehand strokes are stored per slide (§15), with coordinates normalized to
    the slide so they survive layout/aspect changes; default colors come from
    the deck's design template. Timed to the narration — each stroke (and each
    erase, treated as a timestamped event, not a deletion) is anchored to a
    position in the slide's transcript, so during narration playback (PLAY-2)
    the marks appear and disappear in sync with the spoken words, and a GEN-4
    narration refine re-anchors them proportionally. Marks made while not
    recording aren't tied to speech and are…
