- id: TECH-1
  title: Front-end
  full: React (function components + hooks) built with Vite, styled with
    TailwindCSS. Client-side routing for projects, deck viewer/permalinks,
    template library, billing, social feed, and profiles. Real-time slide
    rendering driven by streamed transcription/generation events.
  section: §14 Technical Stack & Conventions
