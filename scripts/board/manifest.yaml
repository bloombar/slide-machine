- id: GEN-9
  title: Animated layout transitions
  full: When an already-displayed slide changes layout — whether from an AI update
    (GEN-8) or a user-driven template/layout change (EDIT-2 / EDIT-3) — the
    change is animated so it looks deliberate, not like a technical glitch.
    Morph, don't snap — shared elements (title, body, image, caption) move,
    resize, and reflow from their old positions to the new layout using stable
    element identity, animating smoothly between old and new placement rather
    than jumping; entering elements fade/slide in, leaving elements fade out.
    Brief and bounded — transitions use a short, consistent duration, and are
    queued/debounced so updates never overlap or trigger rapid re-animation
    (consistent with live stability…
