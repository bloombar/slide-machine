- id: CAP-4
  title: Voice commands
  full: The user can drive the slide generator hands-free by speaking commands —
    at minimum start, stop, pause (and resume), rewind (previous slide), and
    fast-forward (next slide) — mirroring the manual playback controls in
    PLAY-1. Commands are recognized from the same Google Cloud Speech-to-Text
    stream, using a small, configurable command vocabulary (with synonyms, e.g.
    "go back" → rewind) so they are reliably transcribed and unambiguous. A
    wake-word or command prefix (e.g., "slide machine, …") and/or a distinct
    command mode keeps ordinary lecture speech from being misinterpreted as a
    command; normal speech continues to drive slide generation (GEN-1).
    Recognized commands are confirmed visually…
