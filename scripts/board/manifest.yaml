- id: SHARE-2
  title: Post-lecture translated viewing
  full: When viewing a saved deck, students and instructors can switch the
    displayed language of the slide content to any supported locale (English,
    French, Spanish, Russian, Mandarin — TECH-12). This is an on-demand,
    post-lecture viewing option — distinct from the out-of-scope live/real-time
    translated generation (§2.2). Translation uses Google Cloud Translation (key
    already provisioned — TECH-4), behind a provider-agnostic adapter consistent
    with GEN-2. Non-destructive — the translated text is an alternate view
    layered over the deck; the original authored/generated content is preserved
    and remains authoritative (machine translation may be imperfect).
    Translations are computed on demand and cached…
