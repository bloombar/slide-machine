- id: GEN-7
  title: AI image guidance
  full: "For each slide, the AI also recommends the supporting imagery, feeding
    image enrichment (IMG-1): It returns search keywords / query terms to use
    against the image-enrichment providers (Wikimedia / Flickr / Openverse),
    context-qualified to disambiguate polysemous names (e.g., Prince (musician),
    not bare Prince) — see IMG-3. When the project has teacher-supplied (seeded)
    images (SEED-2), their captions/keywords are sent to the model as context
    options, and the model may select a specific seeded image it deems the best
    fit for a given slide (or indicate that no image is needed). For a slide
    better served by a custom diagram/infographic than a stock photo, the model
    may instead recommend…"
