- id: TECH-12
  title: Internationalization (i18n) & localization
  full: "The application UI is fully internationalized — no hardcoded user-facing
    strings. Supported locales at launch: English (en), French (fr), Spanish
    (es), Russian (ru), and Mandarin Chinese (zh). All five are left-to-right;
    the i18n layer should not preclude adding a right-to-left locale later (use
    logical CSS properties and a per-document dir). Implementation — an i18n
    library (e.g., react-i18next / FormatJS with ICU message format) with one
    resource bundle per locale; pluralization and date/number/currency
    formatting via the Intl API. Adding a locale is a resource-bundle addition,
    not a code change. Locale selection — detected from the browser
    (Accept-Language) on first visit, overridable by…"
