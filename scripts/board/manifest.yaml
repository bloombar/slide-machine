- id: TMPL-6
  title: Layout descriptors (for AI selection)
  full: 'Every layout in a template carries a machine-readable descriptor so the
    AI can choose the right layout per slide (GEN-6). A descriptor includes: a
    stable type/id and human label (e.g., title, section, content, list,
    image-heavy, two-column, quote — TMPL-2); a short purpose / when-to-use
    description the AI can reason over (e.g., "use for 3–6 parallel points");
    the content slots the layout expects (e.g., title, body, bullets[], image,
    caption, columns) and any constraints (max bullets, approximate text length,
    whether an image is required/optional). Descriptors are authored as part of
    the template (TMPL-3/TMPL-4), stored with it (§15), and serialized into the
    generation request as the option…'
  section: §7 Style Template Library
