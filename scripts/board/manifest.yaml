- id: PREP-1
  title: Preflight concept extraction
  full: 'When a project has been seeded (SEED-1/SEED-2), the system can run an
    optional, pre-lecture "preflight": the AI analyzes the uploaded files, the
    text description, and image captions to extract a ranked list of concepts
    likely to come up — key terms, named entities (people/places/orgs/products),
    jargon, and acronyms. Each candidate is presented with: a short gloss and
    the source it came from (which seed document/image); a relevance score;
    where a term is ambiguous, a resolved sense / entity suggestion (e.g.,
    Prince → Prince (musician), with the candidate Wikidata entity) to pre-empt
    mismatches (IMG-3). This is feasible with standard AI keyphrase/entity
    extraction over content the project…'
  section: §6 Slide Projects & Seeding
  family: PREP
  phase: 3
  status: Backlog
  review: false
- id: PREP-2
  title: Instructor review & honing
  full: 'The instructor refines the candidate set in an interactive back-and-forth
    before speaking. The UI allows the instructor to: Add concepts the AI missed
    (free text), remove irrelevant ones, and edit labels/glosses. Disambiguate
    an ambiguous term by choosing the intended entity/sense from suggestions
    (pre-resolving IMG-3 for the live run). Set importance/priority (e.g.,
    "definitely cover" vs. "maybe") to weight downstream emphasis. Define
    canonical names with synonyms/abbreviations (e.g., "NYU" ↔ "New York
    University") so variants are recognized. Attach a preferred image per
    concept (from seeded images SEED-2 or a quick search) to be used when the
    concept arises. Iterate with the AI — ask it…'
  section: §6 Slide Projects & Seeding
  family: PREP
  phase: 3
  status: Backlog
  review: false
- id: PREP-3
  title: Use of the honed concept set
  full: "The confirmed concept set is saved to the project (§15), reusable and
    editable across sessions, and drives the live lecture: Generation bias —
    supplied as part of seed context so slide generation (GEN-1) frames and
    prioritizes these concepts correctly. Transcription accuracy — terms, names,
    acronyms, and synonyms are passed to Google Cloud Speech-to-Text speech
    adaptation / phrase hints (CAP-3) so jargon and proper nouns transcribe
    correctly live. Image pre-resolution — disambiguated entities and preferred
    images mean the right picture is chosen the moment a concept is spoken
    (GEN-7 / IMG-3)."
  section: §6 Slide Projects & Seeding
  family: PREP
  phase: 3
  status: Backlog
