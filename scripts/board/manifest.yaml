- id: BILL-2
  title: Billing provider (Stripe) integration
  full: "Payments and subscription management run through a configured billing
    provider — Stripe by default, integrated behind a provider-agnostic
    abstraction (TECH-9) so a different provider can be adopted later without
    reworking application logic: Checkout for new subscriptions and tier
    upgrades/downgrades. A hosted customer/billing portal for managing payment
    methods, invoices, and cancellation. Webhooks keep the user's subscription
    status (active, past-due, canceled) in sync with the provider as the source
    of truth for billing state; events are normalized to internal billing events
    at the adapter boundary. The app never handles raw card data; the billing
    provider is the system of record for…"
  section: §5 Plans, Billing & Usage Limits
  family: BILL
  phase: 3
  status: Backlog
  review: false
- id: BILL-3
  title: Usage caps & metering
  full: "Each tier carries usage caps on AI and other costly services, metered per
    billing period and enforced server-side. Metrics are provider-neutral
    (aiTokens, not geminiTokens) so swapping an adapter (TECH-8) never renames a
    persisted metric. null means unlimited; 0 means the capability is
    unavailable on that tier, which is how paid-only features are gated without
    a second mechanism. The metered resources: aiTokens — input + output across
    every LLM call: slide generation, refine, narrate, reformat, quiz, image
    re-rank, seed extraction, embeddings. sttMinutes — minutes streamed to cloud
    speech-to-text, summed across stream restarts, including post-lecture
    re-transcription (which is…"
  section: §5 Plans, Billing & Usage Limits
  family: BILL
  phase: 3
  status: Backlog
  review: false
- id: BILL-4
  title: Enforcement & upgrade prompts
  full: "When a metered cap is reached, the system fails gracefully: the costly
    operation is blocked rather than silently incurring cost, and the user is
    shown a clear message with an upgrade path. Caps reset at the start of each
    billing period. Higher tiers raise the relevant caps. Hard stop, never
    overage. Exceeding a cap returns HTTP 402 and the operation does not run;
    usage is never billed beyond the plan. Anything already generated and cached
    keeps working, so hitting a cap degrades what can be _created_, never what
    already exists. Warn before blocking. Crossing ~80% of a cap raises an
    in-app warning; exhaustion sends an email to the account owner as well,
    since the person who can act on it is…"
  section: §5 Plans, Billing & Usage Limits
  family: BILL
  phase: 3
  status: Backlog
  review: false
- id: BILL-5
  title: Plan management
  full: Users can upgrade, downgrade, or cancel at any time via Stripe Checkout /
    the billing portal, with proration handled by Stripe. Feature access and
    caps update to match the active tier; downgrades take effect per the
    configured policy (immediately or at period end). A downgrade can delete
    data. Tiers differ in audioRetentionDays (BILL-3), so moving down shortens
    how long lecture audio is kept and may put existing recordings past the new
    limit. The user is warned about what will be removed before confirming
    (P-10). There is no tier above Max. A Max user who needs more is directed to
    contact us for a custom arrangement rather than shown an upgrade that does
    not exist.
  section: §5 Plans, Billing & Usage Limits
  family: BILL
  phase: 3
  status: Backlog
  review: false
- id: BILL-6
  title: Configurable pricing & caps
  full: "Tier definitions — price and per-tier usage caps — live in server-side
    configuration (BILL config + Stripe price IDs in TECH-4) and are adjustable
    without code changes. Exact prices and cap values are TBD and will be tuned
    against real service costs (§19). Per-unit vendor prices are configuration
    too — the rate per million tokens, per STT minute, per million TTS
    characters, and so on — so cost accounting (BILL-7) re-prices when a vendor
    changes its rates without touching code. Recorded cost is nevertheless
    frozen at the moment it is written: a later price change must never
    retroactively re-price history. Adding a cap must not be able to take the
    server down: a metric absent from the config…"
  section: §5 Plans, Billing & Usage Limits
  family: BILL
  phase: 3
  status: Backlog
  review: false
- id: BILL-7
  title: Cost attribution & admin cost reporting
  full: Operators can see what the deployment actually costs, and who it is spent
    on. Every metered event (BILL-3) is recorded to an append-only cost ledger
    carrying the paying user, the acting user, the project and lecture it
    belongs to, the service, the quantity, and the money — priced from the
    configured service prices (BILL-6) and frozen at write time. Attribution.
    Cost rolls up per user, per lecture, and per project — a project's total
    being its lectures plus any project-scoped spend such as seed-material
    extraction. A lecture's owner is not always its project's owner, so both
    references are recorded when the event occurs rather than inferred later.
