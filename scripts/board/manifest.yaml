- id: PREP-4
  title: Verbal interaction with the preflight
  full: The instructor can drive the preflight honing (PREP-2) by voice, not just
    through the UI, using the existing speech-to-text (CAP-3) and gen-AI text
    processing (GEN-2) to interpret intent. The process prompts the instructor
    (e.g., "I found these 12 concepts — anything to add or remove?"), and the
    instructor responds naturally by speaking ("drop the last two, add
    photosynthesis, and Prince means the musician"). Spoken input is transcribed
    (CAP-3) and parsed by the AI into concrete honing actions — add / remove /
    rename / disambiguate / set importance / define synonyms / "suggest more" —
    the same actions available in the PREP-2 UI. Unlike the fixed live command
    vocabulary (CAP-4), this is…
