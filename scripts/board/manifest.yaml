- id: IMG-5
  title: Image attribution & licensing display
  full: "Every image can carry a caption and copyright/license attribution, and
    this metadata is captured, displayed, and editable — regardless of source
    (seeded uploads, enrichment fetches from Wikimedia/Flickr/Openverse — IMG-1,
    or AI-generated — IMG-4). Attribution is frequently a legal requirement of
    the image's license (e.g., Creative Commons BY clauses require crediting the
    author), so the system must surface it on the slide, not merely store it.
    Captured at enrichment — when an image is fetched, its licensing/attribution
    metadata is recorded on the slide (IMG-2). The stored attribution follows
    the TASL convention where available: Title of the work, Author/creator,
    Source URL, and License name…"
